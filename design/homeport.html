<title>Homeport Launcher</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Bungee&family=Fredoka:wght@600;700&family=JetBrains+Mono:wght@500&family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<!--
  Homeport: one launcher for LiveContainer apps and Packager-built ports. Prototype of the iOS UI; plan in docs/LAUNCHER.md.
  Layout: one screen, console-home style. Top bar (tabs, status) > tile row (selected tile grows, shows its name) >
          hero (the selected title's floating 3D logo over its colour field, info + Play/Build) > cards (checks, settings).
          Wide: info left, logo right. Portrait phone: logo above info. Dark only, tinted by the selected title.
-->
<style>
  @property --c1 { syntax: "<color>"; inherits: true; initial-value: #ff8db3; }
  @property --c2 { syntax: "<color>"; inherits: true; initial-value: #ffd66b; }

  :root {
    /* color: a deliberately dark home screen; the selected title supplies --c1 / --c2 */
    --bg: #07090d;
    --ink: #f3f5f9;
    --muted: rgba(243, 245, 249, .64);
    --faint: rgba(243, 245, 249, .4);
    --panel: rgba(255, 255, 255, .07);
    --panel-hi: rgba(255, 255, 255, .13);
    --line: rgba(255, 255, 255, .14);
    --focus: #ffffff;
    --build: #ffc23d;
    --ok: #3ad08a;
    --bad: #ff6b60;
    /* type */
    --f-ui: "M PLUS Rounded 1c", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    /* size */
    --tile: 64px;
    --tile-sel: 100px;
    color-scheme: dark;
  }
  @media (max-width: 640px) { :root { --tile: 54px; --tile-sel: 80px; } }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  svg.i { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---- backdrop: the selected title's colour field --------------------------------------------------------- */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; transition: --c1 .7s ease, --c2 .7s ease; }
  .bg::before {
    content: ""; position: absolute; inset: -10%;
    background:
      radial-gradient(48% 60% at 70% 42%, color-mix(in oklab, var(--c1) 70%, transparent), transparent 70%),
      radial-gradient(35% 45% at 88% 12%, color-mix(in oklab, var(--c2) 55%, transparent), transparent 70%),
      radial-gradient(40% 50% at 18% 95%, color-mix(in oklab, var(--c2) 30%, transparent), transparent 70%),
      linear-gradient(160deg, color-mix(in oklab, var(--c1) 22%, var(--bg)), var(--bg) 70%);
    animation: breathe 14s ease-in-out infinite alternate;
  }
  @keyframes breathe { to { transform: translate(-2%, 2%) scale(1.05); } }
  .bg .watermark {
    position: absolute; right: -6vw; top: 8vh; font-family: var(--lf); font-weight: var(--lw, 400);
    font-size: 58vmax; line-height: .8; color: var(--c1); opacity: .09; transform: rotate(-8deg); user-select: none;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, .55)),
      linear-gradient(180deg, rgba(0, 0, 0, .45), transparent 30%, transparent 55%, rgba(0, 0, 0, .7));
  }

  .app {
    min-height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px 18px;
    max-width: 1500px; margin: 0 auto; grid-template-columns: minmax(0, 1fr);
  }
  .app > * { min-width: 0; }

  /* ---- top bar --------------------------------------------------------------------------------------------- */
  .topbar { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    border: 0; background: none; cursor: pointer; padding: 6px 10px; border-radius: 10px;
    font-size: clamp(18px, 2.4vw, 24px); font-weight: 800; color: var(--faint); transition: color .2s;
  }
  .tab[aria-selected="true"] { color: var(--ink); }
  .grow { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; white-space: nowrap;
    background: var(--panel); border: 1px solid var(--line); font-size: 12px; font-weight: 800;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .chip .dot.off { background: var(--faint); }
  .icon-btn {
    display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer;
    background: none; transition: background .15s;
  }
  .icon-btn:hover { background: var(--panel); }
  .topbar time { font-size: clamp(15px, 1.8vw, 20px); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 520px) { .topbar .chip, .topbar .search { display: none; } }

  /* ---- tile row ------------------------------------------------------------------------------------------ */
  .row {
    display: flex; align-items: flex-start; gap: 10px; overflow-x: auto; scrollbar-width: none;
    padding: 6px 6px 4px; margin: 0 -6px; scroll-snap-type: x proximity; min-height: calc(var(--tile-sel) + 36px);
  }
  .row::-webkit-scrollbar { display: none; }
  .tile {
    position: relative; flex: none; width: var(--tile); border: 0; padding: 0; background: none; cursor: pointer;
    display: grid; gap: 8px; justify-items: start; text-align: left; scroll-snap-align: start;
    transition: width .25s cubic-bezier(.3, 1.2, .5, 1);
  }
  .tile .art {
    position: relative; width: 100%; aspect-ratio: 1; border-radius: 14px; overflow: hidden;
    background: linear-gradient(145deg, var(--t1), var(--t2)); display: grid; place-items: center;
    box-shadow: 0 8px 20px -10px rgba(0, 0, 0, .8);
  }
  .tile .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.4), transparent 45%); }
  .tile .glyph {
    font-family: var(--lf); font-weight: var(--lw, 400); font-size: calc(var(--tile) * .52); line-height: 1; color: var(--tf);
    text-shadow: 0 1px 0 var(--tx), 0 2px 0 var(--tx), 0 3px 0 var(--tx), 0 6px 10px rgba(0, 0, 0, .3);
    transform: rotate(-6deg); transition: font-size .25s;
  }
  .tile.sys .art { background: var(--panel-hi); border: 1px solid var(--line); box-shadow: none; }
  .tile.sys .art svg.i { width: 42%; height: 42%; }
  .tile .label {
    font-size: 13px; font-weight: 800; white-space: nowrap; opacity: 0; transform: translateY(-4px);
    transition: opacity .2s, transform .2s; max-width: calc(var(--tile-sel) * 1.6); overflow: hidden; text-overflow: ellipsis;
  }
  .tile[aria-selected="true"] { width: var(--tile-sel); }
  .tile[aria-selected="true"] .glyph { font-size: calc(var(--tile-sel) * .52); }
  .tile[aria-selected="true"] .art { outline: 3px solid var(--focus); outline-offset: 3px; }
  .tile[aria-selected="true"] .label { opacity: 1; transform: none; }
  .badge {
    position: absolute; right: -5px; top: calc(min(var(--tile), 100%) - 19px); z-index: 1;
    min-width: 22px; height: 22px; padding: 0 5px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 800; letter-spacing: .04em; border: 2px solid var(--bg);
  }
  .tile[aria-selected="true"] .badge { top: calc(var(--tile-sel) - 19px); }
  .badge svg.i { width: 12px; height: 12px; stroke-width: 2.8; }
  .badge.build { background: var(--build); color: #3b2900; }
  .badge.warn { background: var(--bad); color: #fff; }
  .badge.port { background: var(--ink); color: var(--bg); }
  .ring { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .trk { stroke: rgba(0, 0, 0, .4); }
  .ring .val { stroke: var(--build); stroke-linecap: round; }
  .tile.building .art { filter: saturate(.5) brightness(.8); }

  /* ---- hero -------------------------------------------------------------------------------------------- */
  .hero {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); grid-template-areas: "info stage";
    align-items: center; gap: 12px; min-height: 0;
  }
  .stage {
    grid-area: stage; position: relative; display: grid; place-items: center; container-type: inline-size;
    perspective: 700px; perspective-origin: 50% 40%; min-height: clamp(180px, 34vh, 380px);
  }
  .float { display: grid; place-items: center; transform-style: preserve-3d; animation: bob 4.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .logo3d {
    display: grid; transform-style: preserve-3d; text-align: center;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    font-family: var(--lf); font-weight: var(--lw, 400); font-size: var(--fs, 14cqw); line-height: .92; letter-spacing: .01em;
  }
  .logo3d .layer { grid-area: 1 / 1; white-space: nowrap; transform: translateZ(calc(var(--i) * -1.9px)); }
  .logo3d .side { color: color-mix(in oklab, var(--ex), black calc(var(--i) * 4%)); }
  .logo3d .front {
    background: linear-gradient(180deg, var(--f1) 35%, var(--f2)); -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-stroke: .04em var(--ex); transform: translateZ(4px);
  }
  .logo3d .ribbon {
    grid-area: 1 / 1; align-self: end; justify-self: center; translate: 0 75%; transform: translateZ(14px);
    font: 800 clamp(9px, 2.4cqw, 15px) / 1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap;
    background: var(--ex); color: #fff; padding: .5em 1em; border-radius: 99px; box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .6);
  }
  .shadow {
    position: absolute; left: 50%; bottom: 2%; width: 50cqw; height: 5cqw; translate: -50% 0;
    background: radial-gradient(closest-side, rgba(0, 0, 0, .55), transparent); animation: shadow 4.4s ease-in-out infinite;
  }
  @keyframes shadow { 50% { transform: scale(.8); opacity: .6; } }
  .logo-enter { animation: enter .6s cubic-bezier(.2, 1.3, .4, 1); }
  @keyframes enter { from { opacity: 0; transform: translateZ(-160px) rotateY(-25deg) scale(.85); } }

  .info { grid-area: info; display: grid; gap: 10px; align-content: center; min-width: 0; max-width: 520px; }
  .eyebrow { font-size: 14px; font-weight: 700; color: var(--muted); }
  .eyebrow b { color: var(--ink); }
  .info h1 { margin: 0; font-size: clamp(26px, 3.6vw, 44px); line-height: 1.08; font-weight: 800; text-wrap: balance; }
  .info p { margin: 0; font-size: clamp(14px, 1.5vw, 17px); color: var(--muted); font-weight: 700; line-height: 1.5; }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; min-height: 52px; }
  .primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 150px; height: 50px; padding: 0 26px;
    border: 0; border-radius: 99px; cursor: pointer; background: var(--ink); color: var(--bg); font-size: 17px; font-weight: 800;
    transition: transform .1s, box-shadow .2s; box-shadow: 0 10px 30px -12px color-mix(in oklab, var(--c1) 80%, transparent);
  }
  .primary.build { background: var(--build); color: #3b2900; }
  .primary:active { transform: scale(.96); }
  .more {
    width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer;
    display: grid; place-items: center; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .progress { flex: 1; max-width: 420px; display: grid; gap: 7px; }
  .progress .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 800; }
  .progress .top span:last-child { font-variant-numeric: tabular-nums; }
  .progress .bar { height: 6px; border-radius: 3px; background: var(--panel-hi); overflow: hidden; }
  .progress .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--c1), var(--build)); }
  .progress code { font: 500 12px var(--f-mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .menu {
    position: absolute; z-index: 5; min-width: 210px; padding: 6px; border-radius: 14px; display: grid;
    background: rgba(24, 28, 36, .92); border: 1px solid var(--line); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 20px 40px -16px rgba(0, 0, 0, .8); animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .menu button { border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .menu button:hover, .menu button:focus-visible { background: var(--panel-hi); outline: none; }

  /* ---- cards ----------------------------------------------------------------------------------------------- */
  .cards { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 6px; scroll-snap-type: x proximity; }
  .cards::-webkit-scrollbar { display: none; }
  .card {
    flex: none; width: clamp(200px, 21vw, 280px); min-height: 118px; padding: 14px; border-radius: 16px; scroll-snap-align: start;
    display: grid; grid-template-rows: auto 1fr; gap: 10px;
    background: linear-gradient(160deg, color-mix(in oklab, var(--c1) 14%, rgba(255, 255, 255, .06)), rgba(255, 255, 255, .04));
    border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    animation: rise .35s ease-out backwards; animation-delay: calc(var(--n) * 45ms);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .card .head { display: flex; align-items: center; gap: 10px; }
  .card .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in oklab, var(--c1) 30%, transparent); flex: none; }
  .card .head b { flex: 1; font-size: 14px; }
  .card .st { color: var(--ok); } .card.bad .st { color: var(--bad); }
  .card .body { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
  .card.bad .body { color: var(--bad); }
  .card code { font: 500 12px var(--f-mono); color: var(--ink); }
  .card .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; color: var(--ink); font-size: 13px; }
  .card .switch input { width: 22px; height: 22px; accent-color: var(--ok); }

  /* ---- overlays -------------------------------------------------------------------------------------------- */
  .launch {
    position: fixed; inset: 0; z-index: 9; display: grid; place-content: center; gap: 12px; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 45%, color-mix(in oklab, var(--c1) 75%, white), var(--c2));
    color: #10131a; font-size: 18px; font-weight: 800; animation: flash .4s ease-out;
  }
  .launch code { font: 500 13px/1.5 var(--f-mono); opacity: .7; overflow-wrap: anywhere; }
  @keyframes flash { from { opacity: 0; transform: scale(1.06); } }
  .launching .stage { transition: transform .5s ease-in, opacity .5s; transform: scale(1.8); opacity: 0; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 8;
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 800;
    animation: toast 2.8s ease forwards; max-width: calc(100vw - 32px); text-align: center;
  }
  @keyframes toast { 0% { opacity: 0; translate: -50% 10px; } 10%, 85% { opacity: 1; translate: -50% 0; } 100% { opacity: 0; } }
  .hints { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--faint); font-size: 12px; font-weight: 700; }
  .hints kbd { font: 500 11px var(--f-mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
  @media (hover: none) { .hints .keys { display: none; } }

  /* portrait phone: logo above the text, everything scrolls */
  @media (max-width: 760px) and (orientation: portrait) {
    .hero { grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "info"; gap: 4px; }
    .stage { min-height: 0; aspect-ratio: 16 / 10; }
    .bg .watermark { top: 20vh; }
  }
  /* landscape phone: short screen, tighten everything */
  @media (max-height: 500px) and (orientation: landscape) {
    :root { --tile: 46px; --tile-sel: 64px; }
    .app { gap: 4px; padding-block: 8px 10px; }
    .stage { min-height: 150px; }
    .info h1 { font-size: 24px; } .info p { font-size: 13px; }
    .primary, .more { height: 42px; } .more { width: 42px; }
    .card { min-height: 90px; padding: 10px; }
    .hints { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .float, .shadow, .bg::before, .card { animation: none; }
    .logo-enter, .launch, .menu { animation-duration: .01s; }
  }
</style>

<div class="bg" id="bg"><span class="watermark" id="watermark" aria-hidden="true">T</span></div>
<div class="app" id="app">
  <header class="topbar">
    <div class="tabs" role="tablist" aria-label="Library">
      <button class="tab" role="tab" id="tab-games" aria-selected="true" type="button">Games</button>
      <button class="tab" role="tab" id="tab-apps" aria-selected="false" type="button">Apps</button>
    </div>
    <span class="grow"></span>
    <span class="chip"><span class="dot" id="jitDot"></span><span id="lcState">LiveContainer</span></span>
    <button class="icon-btn search" type="button" aria-label="Search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    <button class="icon-btn" id="settings" type="button" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
    <time id="clock">10:03</time>
  </header>

  <nav class="row" id="row" role="listbox" aria-label="Games" aria-orientation="horizontal"></nav>

  <section class="hero" id="hero">
    <div class="stage" id="stage">
      <div class="float"><div class="logo3d" id="logo"></div></div>
      <div class="shadow"></div>
    </div>
    <div class="info">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="name"></h1>
      <p id="blurb"></p>
      <div class="actions" id="actions"></div>
    </div>
  </section>

  <div>
    <section class="cards" id="cards" aria-label="Details"></section>
    <div class="hints"><span class="keys"><kbd>← →</kbd> move · <kbd>Enter</kbd> play / build · <kbd>Tab</kbd> games / apps ·</span>
      <span>Prototype: only Tomodachi is a real port; the other titles are samples.</span></div>
  </div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const I = {

    build: '<svg class="i" viewBox="0 0 24 24"><path d="M12.5 5.5l3-3 6 6-3 3z"/><path d="M14.5 9.5L4 20"/></svg>',
    warn: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>',
    check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    box: '<svg class="i" viewBox="0 0 24 24"><path d="M3 7.5l9-4 9 4v9l-9 4-9-4z"/><path d="M3 7.5l9 4 9-4M12 11.5v9"/></svg>',
    pad: '<svg class="i" viewBox="0 0 24 24"><path d="M6.5 8h11a4 4 0 0 1 4 4v1.5a2.8 2.8 0 0 1-5 1.7L15 13.5H9l-1.5 1.7a2.8 2.8 0 0 1-5-1.7V12a4 4 0 0 1 4-4z"/><path d="M7 10.5v3M5.5 12h3"/></svg>',
    key: '<svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg>',
    folder: '<svg class="i" viewBox="0 0 24 24"><path d="M3 6.5h6l2 2h10v10.5H3z"/></svg>',
    phone: '<svg class="i" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
    bolt: '<svg class="i" viewBox="0 0 24 24"><path d="M13 2.5L5 13.5h6l-1 8 8-11h-6z"/></svg>',
    win: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9h18"/></svg>',
    disk: '<svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
    link: '<svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
    layers: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
    dots: '<svg class="i" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor"/></svg>',
  };

  // Library. kind: sys (Homeport's own tiles), port (a Packager pack in the folder), app (installed in LiveContainer).
  const SYS_PACKS = { id: 'packs', kind: 'sys', icon: 'folder', name: 'Packager', full: 'Packager folder', logo: ['Packager'], ribbon: 'Build ports',
    lf: '"M PLUS Rounded 1c"', lw: 800, c1: '#3d6cff', c2: '#29d3c6', ex: '#1d3a99', f1: '#ffffff', f2: '#cfe0ff' };
  const SYS_ADD = { id: 'add', kind: 'sys', icon: 'plus', name: 'Install IPA', full: 'Install an app', logo: ['Install'], ribbon: 'Any .ipa',
    lf: '"M PLUS Rounded 1c"', lw: 800, c1: '#7f8aa3', c2: '#3e4a66', ex: '#2c3550', f1: '#ffffff', f2: '#dfe5f2' };
  const TOMO = { id: 'tomodachi', kind: 'port', state: 'ready', name: 'Tomodachi', logo: ['Tomodachi'], ribbon: 'Living the Dream',
    full: 'Tomodachi Life: Living the Dream', lf: '"Lilita One"', glyph: 'T',
    c1: '#ff6fa3', c2: '#ffcb52', ex: '#b83a6f', f1: '#ffffff', f2: '#ffe3ee', t1: '#ffa0c2', t2: '#ffcb6a', tf: '#fff', tx: '#b83a6f',
    pack: 'tomodachi.nxport', portVer: '0.1.0', titleId: '010051F0207B2000', gameVer: '1.0.0', bundle: 'io.github.tenma.tomodachi',
    dump: 'Tomodachi Life [010051F0207B2000][v0].xci', container: 'Tomodachi', jit: false,
    after: 'Open the app and choose the same .xci (and prod.keys) once.' };
  const GAMES = [SYS_PACKS, TOMO,
    { id: 'garden', kind: 'port', state: 'nodump', sample: true, name: 'Hollow Garden', logo: ['Hollow', 'Garden'], ribbon: 'Sample port',
      full: 'Hollow Garden', lf: '"Baloo 2"', lw: 800, glyph: 'H',
      c1: '#3fc495', c2: '#2c7da0', ex: '#1a554f', f1: '#f4ffe9', f2: '#b7efc5', t1: '#6fd9ab', t2: '#2c7da0', tf: '#f4ffe9', tx: '#1a554f',
      pack: 'hollow-garden.nxport', portVer: '0.3.0', titleId: '0100000000000000', gameVer: '1.2.0', bundle: 'com.example.hollowgarden' },
    { id: 'starfall', kind: 'app', state: 'installed', sample: true, name: 'Starfall Arcade', logo: ['Starfall', 'Arcade'],
      full: 'Starfall Arcade', lf: '"Bungee"', glyph: 'S',
      c1: '#6a5cff', c2: '#ff4f97', ex: '#33278f', f1: '#fff6b0', f2: '#ffb547', t1: '#8a7bff', t2: '#ff6aa8', tf: '#fff6b0', tx: '#33278f',
      bundle: 'com.example.starfall', container: 'Starfall', jit: true, size: '212 MB', played: 'yesterday' },
    { id: 'kiln', kind: 'app', state: 'installed', sample: true, name: 'Kiln', logo: ['Kiln'], ribbon: 'Pottery sim',
      full: 'Kiln', lf: '"Fredoka"', lw: 700, glyph: 'K',
      c1: '#ff7a3c', c2: '#b4452c', ex: '#6b2516', f1: '#fff3e6', f2: '#ffc59a', t1: '#ff9b62', t2: '#a83e28', tf: '#fff3e6', tx: '#6b2516',
      bundle: 'com.example.kiln', container: 'Kiln', jit: false, size: '96 MB', played: '3 days ago' },
  ];
  const APPS = [SYS_ADD,
    { id: 'lumen', kind: 'app', state: 'installed', sample: true, name: 'Lumen Notes', logo: ['Lumen'], ribbon: 'Notes',
      full: 'Lumen Notes', lf: '"M PLUS Rounded 1c"', lw: 800, glyph: 'L',
      c1: '#3fb6ff', c2: '#2f5bff', ex: '#173a8a', f1: '#ffffff', f2: '#d6eeff', t1: '#6fd0ff', t2: '#2f6bff', tf: '#fff', tx: '#173a8a',
      bundle: 'com.example.lumen', container: 'Lumen', jit: false, size: '18 MB', played: 'last week' },
    { id: 'shell', kind: 'app', state: 'installed', sample: true, name: 'Pocket Shell', logo: ['Pocket', 'Shell'],
      full: 'Pocket Shell', lf: '"Bungee"', glyph: '>',
      c1: '#22c55e', c2: '#0f766e', ex: '#0b3d33', f1: '#eafff1', f2: '#9ff0bf', t1: '#34d27a', t2: '#0f766e', tf: '#eafff1', tx: '#0b3d33',
      bundle: 'com.example.pocketshell', container: 'Pocket Shell', jit: true, size: '41 MB', played: 'today' },
  ];
  let tab = 'games', sel = 1, busy = false;
  const list = () => tab === 'games' ? GAMES : APPS;
  const cur = () => list()[sel];
  const row = $('#row'), logo = $('#logo'), bg = $('#bg');

  // ---- tiles ------------------------------------------------------------------------------------------------
  function badge(a) {
    if (a.kind !== 'port') return '';
    if (a.state === 'ready') return `<span class="badge build">${I.build}</span>`;
    if (a.state === 'nodump') return `<span class="badge warn">${I.warn}</span>`;
    if (a.state === 'installed') return '<span class="badge port">PORT</span>';
    return '';
  }
  const words = (a) => a.kind === 'sys' ? '' : { ready: 'ready to build', nodump: 'needs your game dump', building: 'building',
    installed: a.kind === 'port' ? 'built port' : 'installed' }[a.state];
  function tile(a, i) {
    const vars = `--t1:${a.t1};--t2:${a.t2};--tf:${a.tf};--tx:${a.tx};--lf:${a.lf};--lw:${a.lw || 400}`;
    const art = a.kind === 'sys' ? I[a.icon] : `<span class="glyph">${a.glyph}</span>`;
    const ring = a.state === 'building' ? '<svg class="ring" viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="40"/><circle class="val" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="251.3"/></svg>' : '';
    return `<button class="tile ${a.kind === 'sys' ? 'sys' : ''} ${a.state === 'building' ? 'building' : ''}" id="t-${a.id}" role="option" type="button"
      data-i="${i}" aria-selected="${i === sel}" tabindex="${i === sel ? 0 : -1}" style="${vars}" aria-label="${a.name}${words(a) ? ', ' + words(a) : ''}">
      <span class="art">${art}${ring}</span>${badge(a)}<span class="label">${a.name}</span></button>`;
  }
  function renderRow() {
    const focused = row.contains(document.activeElement);
    row.innerHTML = list().map(tile).join('');
    row.setAttribute('aria-label', tab === 'games' ? 'Games' : 'Apps');
    if (focused) row.children[sel].focus({ preventScroll: true });
  }

  // ---- hero ---------------------------------------------------------------------------------------------------
  function renderLogo(a) {
    const lines = a.logo, longest = Math.max(...lines.map((l) => l.length));
    const fs = Math.min(19, 92 / (longest * .6 + .6) / Math.max(1, lines.length * .78));
    const text = lines.join('<br>');
    let html = '';
    for (let i = 16; i >= 1; i--) html += `<span class="layer side" aria-hidden="true" style="--i:${i}">${text}</span>`;
    html += `<span class="layer front" aria-hidden="true">${text}</span>`;
    if (a.ribbon) html += `<span class="ribbon" aria-hidden="true">${a.ribbon}</span>`;
    logo.innerHTML = html;
    logo.style.cssText = `--lf:${a.lf};--lw:${a.lw || 400};--fs:${fs}cqw;--ex:${a.ex};--f1:${a.f1};--f2:${a.f2}`;
    logo.classList.remove('logo-enter'); void logo.offsetWidth; logo.classList.add('logo-enter');
    bg.style.setProperty('--c1', a.c1); bg.style.setProperty('--c2', a.c2);
    document.documentElement.style.setProperty('--c1', a.c1); document.documentElement.style.setProperty('--c2', a.c2);
    const wm = $('#watermark'); wm.textContent = a.glyph || a.logo[0][0]; wm.style.cssText = `--lf:${a.lf};--lw:${a.lw || 400}`;
  }
  const actionFor = (a) => a.id === 'packs' ? ['Check again', ''] : a.id === 'add' ? ['Choose IPA', ''] : a.state === 'ready' ? ['Build', 'build']
    : a.state === 'nodump' ? ['Show folder', ''] : ['Play', ''];
  function renderInfo() {
    const a = cur();
    const ports = GAMES.filter((g) => g.kind === 'port');
    $('#eyebrow').innerHTML = {
      sys: a.id === 'packs' ? `<b>Homeport</b> | ${ports.length} port packs in the folder` : '<b>LiveContainer</b> | install',
      port: `<b>Port ${a.portVer}</b> | ${a.state === 'installed' ? 'built on this iPhone' : a.state === 'nodump' ? 'needs your dump' : a.state === 'building' ? 'building' : 'ready to build'}`,
      app: `<b>LiveContainer app</b> | played ${a.played}`,
    }[a.kind];
    $('#name').textContent = a.full;
    $('#blurb').textContent = {
      packs: 'Port packs, your own game dumps and prod.keys go in one folder. Homeport checks them every time you come back.',
      add: 'Install any .ipa into LiveContainer from Files, a link or a source. It runs here without its own App ID.',
    }[a.id] || (a.kind === 'port'
      ? { ready: `Your dump matches: ${a.titleId}, version ${a.gameVer}. Build writes the port straight into LiveContainer.`,
          nodump: `Put your own dump of version ${a.gameVer} in the Packager folder to build this port.`,
          building: 'Rebuilding the port from your dump. Keep Homeport open.',
          installed: `Native iOS port, built from your own dump. ${a.after}` }[a.state]
      : `${a.size}${a.jit ? ' · launches with JIT' : ''} · ${a.sample ? 'Sample app.' : ''}`);
    const acts = $('#actions');
    if (a.state === 'building') return;
    const [label, cls] = actionFor(a);
    acts.innerHTML = `<button class="primary ${cls}" id="go" type="button">${cls === 'build' ? I.build : label === 'Play' ? I.play : ''}${label}</button>
      ${a.kind !== 'sys' ? `<button class="more" id="more" type="button" aria-label="More options" aria-haspopup="menu">${I.dots}</button>` : ''}`;
    $('#go').onclick = primary;
    $('#more')?.addEventListener('click', (e) => openMenu(e.currentTarget));
    $('#jitDot').classList.toggle('off', !a.jit);
    $('#lcState').textContent = a.jit ? 'LiveContainer · JIT' : 'LiveContainer';
  }

  // ---- cards ----------------------------------------------------------------------------------------------------
  const card = (n, ic, title, body, ok) => `<div class="card ${ok === false ? 'bad' : ''}" style="--n:${n}">
    <div class="head"><span class="ic">${ic}</span><b>${title}</b><span class="st">${ok === true ? I.check : ok === false ? I.warn : ''}</span></div>
    <div class="body">${body}</div></div>`;
  function renderCards() {
    const a = cur(), c = $('#cards');
    if (a.id === 'packs') c.innerHTML = [
      card(0, I.folder, 'Folder', 'Files › Homeport › Packs'),
      ...GAMES.filter((g) => g.kind === 'port').map((g, i) => card(i + 1, I.box, g.name, `<code>${g.pack}</code><br>${g.state === 'nodump' ? 'no matching dump' : 'dump matches'}`, g.state !== 'nodump')),
      card(3, I.key, 'prod.keys', 'Found · from your own Switch', true),
    ].join('');
    else if (a.id === 'add') c.innerHTML = [
      card(0, I.folder, 'From Files', 'Pick an .ipa in the Files app.'),
      card(1, I.link, 'From a link', '<code>livecontainer://install?url=…</code>'),
      card(2, I.layers, 'From a source', 'AltStore-format sources you added.'),
    ].join('');
    else if (a.kind === 'port') c.innerHTML = [
      card(0, I.box, 'Port pack', `<code>${a.pack}</code><br>${a.name} ${a.portVer}`, true),
      card(1, I.pad, 'Game dump', a.state === 'nodump' ? `No dump of version ${a.gameVer} yet.` : `<code>${a.dump}</code>`, a.state !== 'nodump'),
      card(2, I.key, 'prod.keys', 'From your own Switch', true),
      a.state === 'installed' ? card(3, I.phone, 'Installed', `Applications/<code>${a.bundle}.app</code>`, true)
        : card(3, I.phone, 'Installs to', `LiveContainer · <code>${a.bundle}.app</code>`),
    ].join('');
    else c.innerHTML = [
      card(0, I.disk, 'Container', `${a.container}<br>${a.size}`),
      card(1, I.bolt, 'JIT', `<label class="switch" for="jit">Launch with JIT<input id="jit" type="checkbox" ${a.jit ? 'checked' : ''}></label>`),
      card(2, I.win, 'Multitask', '<label class="switch" for="mt">Open in a window<input id="mt" type="checkbox"></label>'),
      card(3, I.phone, 'Bundle', `<code>${a.bundle}</code>`),
    ].join('');
    $('#jit')?.addEventListener('change', (e) => { a.jit = e.target.checked; renderInfo(); });
  }

  function select(i, { quiet = false, scroll = true } = {}) {
    const L = list();
    i = Math.max(0, Math.min(L.length - 1, i));
    const changed = i !== sel || quiet;
    sel = i;
    [...row.children].forEach((t, k) => { t.setAttribute('aria-selected', k === sel); t.tabIndex = k === sel ? 0 : -1; });
    if (scroll) row.children[sel].scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: still.matches ? 'auto' : 'smooth' });
    if (changed) { renderLogo(L[sel]); renderCards(); }
    renderInfo();
  }
  function setTab(t) {
    if (t === tab || busy) return;
    tab = t;
    $('#tab-games').setAttribute('aria-selected', t === 'games'); $('#tab-apps').setAttribute('aria-selected', t === 'apps');
    sel = t === 'games' ? 1 : 1;
    renderRow(); select(sel, { quiet: true });
  }

  // ---- parallax --------------------------------------------------------------------------------------------------
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  let tx = 0, ty = 0, cx = 0, cy = 0, lastMove = -1e9;
  addEventListener('pointermove', (e) => {
    const r = $('#stage').getBoundingClientRect();
    tx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (innerWidth / 2)));
    ty = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (innerHeight / 2)));
    lastMove = performance.now();
  }, { passive: true });
  (function frame(t) {
    let gx = tx, gy = ty;
    if (t - lastMove > 2500) { gx = still.matches ? 0 : Math.sin(t / 2300) * .6; gy = still.matches ? 0 : Math.sin(t / 3100) * .35; }
    cx += (gx - cx) * .07; cy += (gy - cy) * .07;
    logo.style.setProperty('--ry', `${(cx * 26).toFixed(2)}deg`);
    logo.style.setProperty('--rx', `${(-cy * 15).toFixed(2)}deg`);
    requestAnimationFrame(frame);
  })(0);

  // ---- actions -------------------------------------------------------------------------------------------------
  function toast(msg) {
    document.querySelector('.toast')?.remove();
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2900);
  }
  function openMenu(btn) {
    closeMenu();
    const a = cur(), r = btn.getBoundingClientRect();
    const m = document.createElement('div'); m.className = 'menu'; m.id = 'menu'; m.setAttribute('role', 'menu');
    const items = a.kind === 'port'
      ? [['Show in Files', 'Opened Files › Homeport › Packs'], ['Check again', 'Checked the folder again'], [a.state === 'installed' ? 'Rebuild' : 'Port homepage', a.state === 'installed' ? 'Rebuild starts from your dump' : 'github.com/herrtenma/tomodachi-life-ios']]
      : [['App settings', 'LiveContainer app settings'], ['Add to home screen', 'Shortcut uses livecontainer-launch'], ['Hide', `${a.name} hidden (sample)`]];
    m.innerHTML = items.map(([l], i) => `<button role="menuitem" type="button" data-k="${i}">${l}</button>`).join('');
    m.style.left = `${Math.min(r.left, innerWidth - 226) + scrollX}px`; m.style.top = `${r.bottom + 8 + scrollY}px`;
    document.body.appendChild(m);
    m.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; closeMenu(); toast(items[+b.dataset.k][1]); };
    m.querySelector('button').focus();
    setTimeout(() => addEventListener('pointerdown', outside), 0);
  }
  function outside(e) { if (!e.target.closest('#menu')) closeMenu(); }
  function closeMenu() { $('#menu')?.remove(); removeEventListener('pointerdown', outside); }

  const STEPS = (a) => [
    [`Reading ${a.pack}`, .08], [`Checking the dump · ${a.titleId} v0`, .12], ['Decompressing main from ExeFS', .26],
    ['Checking input_sha256', .08], ['Applying patches/main.nxwp', .14], ['Checking output_sha256', .07],
    ['Filling slots __NX1T, __NX1D, __NX2T…', .12], [`Installing into Applications/${a.bundle}.app`, .08],
    ["Signing with LiveContainer's certificate", .05],
  ];
  function build(a) {
    busy = true; a.state = 'building'; renderRow(); renderInfo();
    $('#actions').innerHTML = '<div class="progress" role="status"><div class="top"><span id="pStep"></span><span id="pPct">0%</span></div><div class="bar"><i id="pBar"></i></div><code id="pFile"></code></div>';
    $('#pFile').textContent = `${a.pack} + ${a.dump} + prod.keys`;
    const steps = STEPS(a), total = 6200, t0 = performance.now();
    (function tick(now) {
      const f = Math.min(1, (now - t0) / total);
      let acc = 0, step = steps[steps.length - 1][0];
      for (const [s, w] of steps) { acc += w; if (f <= acc) { step = s; break; } }
      $('#pStep').textContent = step + (f < 1 ? '…' : ''); $('#pPct').textContent = `${Math.round(f * 100)}%`;
      $('#pBar').style.width = `${f * 100}%`;
      const ring = document.querySelector(`#t-${a.id} .val`); if (ring) ring.style.strokeDashoffset = 251.3 * (1 - f);
      if (f < 1) return requestAnimationFrame(tick);
      setTimeout(() => {
        a.state = 'installed'; busy = false;
        if (tab === 'games') { renderRow(); select(sel, { quiet: true, scroll: false }); }
        toast(`${a.name} is installed in LiveContainer`);
      }, 300);
    })(t0);
  }
  function play(a) {
    busy = true; document.body.classList.add('launching');
    const l = document.createElement('div'); l.className = 'launch'; l.setAttribute('role', 'status');
    setTimeout(() => {
      l.innerHTML = `<span>Opening ${a.name}</span><code>launchAppWithBundleId("${a.bundle}.app", container: "${a.container}", jit: ${!!a.jit})</code>`;
      document.body.appendChild(l);
    }, 420);
    setTimeout(() => { l.remove(); document.body.classList.remove('launching'); busy = false; renderLogo(a); toast('Back to Homeport'); }, 2600);
  }
  function primary() {
    const a = cur(); if (busy) return;
    if (a.id === 'packs') return toast('Checked the folder: 2 packs, 1 dump, prod.keys');
    if (a.id === 'add') return toast('Opens the Files picker for an .ipa');
    if (a.state === 'ready') return build(a);
    if (a.state === 'nodump') return toast('Opened Files › Homeport › Packs');
    if (a.state === 'installed') return play(a);
  }

  // ---- input -------------------------------------------------------------------------------------------------------
  row.addEventListener('click', (e) => {
    const t = e.target.closest('.tile'); if (!t || busy) return;
    const i = +t.dataset.i; if (i === sel) primary(); else select(i);
  });
  $('#tab-games').onclick = () => setTab('games');
  $('#tab-apps').onclick = () => setTab('apps');
  $('#settings').onclick = () => toast('LiveContainer settings: certificate, JIT, app groups');
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeMenu(); return; }
    if ($('#menu') || e.target.matches('input')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); select(sel + 1); row.children[sel].focus({ preventScroll: true }); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); select(sel - 1); row.children[sel].focus({ preventScroll: true }); }
    else if (e.key === 'Tab' && e.target.closest('.row')) { e.preventDefault(); setTab(tab === 'games' ? 'apps' : 'games'); row.children[sel].focus(); }
    else if (e.key === 'Enter' && e.target.closest('.row')) { e.preventDefault(); primary(); }
  });

  const clock = () => { $('#clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
  clock(); setInterval(clock, 15000);
  renderRow();
  select(1, { quiet: true, scroll: false });
})();
</script>
